[[case]]
prompt = "What would Sonar complain about in this code? Report by category; do not change anything."
fixture = "repo"
commands = ["code-jig analyze"]
output = ["(?i)unused"]

[[case]]
prompt = "Run the code analysis on this repository and list what it reports, by category. Do not change anything."
fixture = "rust"
commands = ["code-jig analyze"]
output = ["undocumented-unsafe", "src/lib\\.rs"]
