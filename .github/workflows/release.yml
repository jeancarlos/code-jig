name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  ci:
    permissions:
      contents: write
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: build
        run: PYTHONPATH=. python .github/scripts/build_release.py "$GITHUB_REF_NAME" dist
      - name: summary
        run: |
          {
            echo "### release assets"
            echo '```'
            (cd dist && sha256sum *)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/code-jig.zip dist/SHA256SUMS dist/bootstrap.py --title "$GITHUB_REF_NAME" --generate-notes
