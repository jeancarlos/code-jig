name: ci
on: [push, pull_request]
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: install.sh smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./install.sh --overlay overlay-examples/personal --codex-home "$RUNNER_TEMP/codex home"
          head -n 1 "$RUNNER_TEMP/codex home/AGENTS.md" | grep -q '^<!-- generated by codex-harness'
      - name: install.ps1 smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 --overlay overlay-examples/personal --codex-home "$env:RUNNER_TEMP/codex home"
          $f = Join-Path "$env:RUNNER_TEMP/codex home" "AGENTS.md"
          if (-not (Test-Path $f)) { throw "missing $f" }
          if (-not (Get-Content -LiteralPath $f -TotalCount 1).StartsWith("<!-- generated by codex-harness")) { throw "bad first line" }
  codex-keys:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @openai/codex@0.162.1
      - name: doctor --check-binary
        shell: bash
        run: |
          bin=$(find "$(npm root -g)/@openai" -type f \( -name codex -o -name codex.exe \) -size +10M | head -1)
          echo "native binary: $bin"
          python -m harness doctor --check-binary --codex-bin "$bin"
      - name: execpolicy example and full doctor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bin=$(find "$(npm root -g)/@openai" -type f -name codex -size +10M | head -1)
          "$bin" execpolicy check --rules overlay-examples/personal/rules/toolchain.rules git push --force origin main | grep -q '"decision":"forbidden"'
          test "$("$bin" execpolicy check --rules overlay-examples/personal/rules/toolchain.rules git push origin main)" = '{"matchedRules":[]}'
          home="$RUNNER_TEMP/codex home"
          python -m harness --overlay overlay-examples/personal --codex-home "$home" install
          python -m harness --overlay overlay-examples/personal --codex-home "$home" doctor --codex-bin "$bin"
  lint-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes agnix@0.57.0 .
